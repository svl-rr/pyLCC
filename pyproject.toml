[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylcc"
version = "0.1.0"
description = "Lightweight, modular OpenLCB / LCC (Layout Command Control) protocol stack for MicroPython and Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "SVL Model Railroad", email = "info@svl-rr.com" }
]
keywords = [
    "openlcb",
    "lcc",
    "nmra",
    "model-railroad",
    "micropython",
    "can-bus",
    "gridconnect",
    "jmri",
    "esp32",
    "rp2040",
    "raspberry-pi-pico"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/svl-rr/pyLCC"
Repository = "https://github.com/svl-rr/pyLCC.git"
Issues = "https://github.com/svl-rr/pyLCC/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pylcc*"]
